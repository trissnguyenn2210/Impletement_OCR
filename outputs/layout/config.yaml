DETR:
  backbone: PPHGNetV2
  detr_head: DINOHead
  neck: HybridEncoder
  post_process: DETRPostProcess
  transformer: RTDETRTransformer
DETRPostProcess:
  num_top_queries: 300
DINOHead:
  loss:
    aux_loss: true
    loss_coeff:
      bbox: 5
      class: 1
      giou: 2
    matcher:
      matcher_coeff:
        bbox: 5
        class: 2
        giou: 2
      name: HungarianMatcher
    name: DINOLoss
    use_vfl: true
EvalDataset:
  allow_empty: true
  anno_path: annotations/instance_val.json
  dataset_dir: /home/tntri/data/OCR_dataset_coco
  image_dir: images
  name: COCODetDataset
EvalReader:
  batch_size: 4
  drop_last: false
  sample_transforms:
  - Decode: {}
  - Resize:
      interp: 2
      keep_ratio: false
      target_size:
      - 800
      - 800
  - NormalizeImage:
      mean:
      - 0.0
      - 0.0
      - 0.0
      norm_type: none
      std:
      - 1.0
      - 1.0
      - 1.0
  - Permute: {}
  shuffle: false
HybridEncoder:
  encoder_layer:
    activation: gelu
    d_model: 256
    dim_feedforward: 1024
    dropout: 0.0
    name: TransformerLayer
    nhead: 8
  expansion: 1.0
  hidden_dim: 256
  num_encoder_layers: 1
  use_encoder_idx:
  - 2
LearningRate:
  base_lr: 0.0001
  schedulers:
  - !PiecewiseDecay
    gamma:
    - 1.0
    milestones:
    - 100
    use_warmup: true
    values: null
  - !LinearWarmup
    epochs: null
    epochs_first: false
    start_factor: 0.001
    steps: 100
OptimizerBuilder:
  clip_grad_by_norm: 0.1
  optimizer:
    type: AdamW
    weight_decay: 0.0001
  regularizer: false
PPHGNetV2:
  arch: L
  freeze_at: 0
  freeze_norm: true
  freeze_stem_only: true
  lr_mult_list:
  - 0.0
  - 0.05
  - 0.05
  - 0.05
  - 0.05
  return_idx:
  - 1
  - 2
  - 3
RTDETRTransformer:
  activation: relu
  box_noise_scale: 1.0
  dim_feedforward: 1024
  dropout: 0.0
  feat_strides:
  - 8
  - 16
  - 32
  label_noise_ratio: 0.5
  learnt_init_query: false
  nhead: 8
  num_decoder_layers: 6
  num_denoising: 100
  num_levels: 3
  num_queries: 300
  position_embed_type: sine
TestDataset: !ImageFolder
  anno_path: annotations/instance_val.json
  dataset_dir: /home/tntri/data/OCR_dataset_coco
  image_dir: ''
  sample_num: -1
  use_default_label: null
TestReader:
  batch_size: 1
  drop_last: false
  inputs_def:
    image_shape:
    - 3
    - 800
    - 800
  sample_transforms:
  - Decode: {}
  - Resize:
      interp: 2
      keep_ratio: false
      target_size:
      - 800
      - 800
  - NormalizeImage:
      mean:
      - 0.0
      - 0.0
      - 0.0
      norm_type: none
      std:
      - 1.0
      - 1.0
      - 1.0
  - Permute: {}
  shuffle: false
TrainDataset:
  anno_path: annotations/instance_train.json
  data_fields:
  - image
  - gt_bbox
  - gt_class
  - is_crowd
  dataset_dir: /home/tntri/data/OCR_dataset_coco
  image_dir: images
  name: COCODetDataset
TrainReader:
  batch_size: 8
  batch_transforms:
  - BatchRandomResize:
      keep_ratio: false
      random_interp: true
      random_size: true
      target_size:
      - 672
      - 704
      - 736
      - 768
      - 800
      - 800
      - 800
      - 800
      - 832
      - 864
      - 896
      - 928
  - NormalizeImage:
      mean:
      - 0.0
      - 0.0
      - 0.0
      norm_type: none
      std:
      - 1.0
      - 1.0
      - 1.0
  - NormalizeBox: {}
  - BboxXYXY2XYWH: {}
  - Permute: {}
  collate_batch: false
  drop_last: true
  sample_transforms:
  - Decode: {}
  - RandomDistort:
      prob: 0.8
  - RandomExpand:
      fill_value:
      - 123.675
      - 116.28
      - 103.53
  - RandomCrop:
      prob: 0.8
  - RandomFlip: {}
  shuffle: true
  use_shared_memory: true
amp: false
architecture: DETR
early_stopping_min_delta: 0.0
early_stopping_patience: 20
ema_decay: 0.9999
ema_decay_type: exponential
ema_filter_no_grad: true
enable_ce: false
epoch: 100
eval: true
eval_size:
- 800
- 800
export:
  benchmark: false
  fuse_conv_bn: false
  nms: true
  post_process: true
export_with_pir: true
filename: detmodel_PP-DocLayout_plus-L
find_unused_parameters: true
fleet: false
hidden_dim: 256
log_iter: 10
metric: COCO
norm_type: sync_bn
num_classes: 4
pdx_model_name: PP-DocLayout_plus-L
pretrain_weights: /home/tntri/OCR_project/models/PP-DocLayout_plus-L_pretrained.pdparams
print_flops: false
print_params: false
profiler_options: null
proposals_path: sniper/proposals.json
resume: null
save_dir: /home/tntri/OCR_project/outputs/layout
save_prediction_only: false
save_proposals: false
snapshot_epoch: 1
to_static: false
uniform_output_enabled: true
use_ema: true
use_focal_loss: true
use_gpu: true
use_iluvatar_gpu: false
use_metax_gpu: false
use_mlu: false
use_npu: false
use_vdl: false
use_wandb: false
use_xpu: false
vdl_log_dir: vdl_log_dir/scalar
worker_num: 4
